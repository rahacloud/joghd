# Joghd Configuration Example
# Copy this file to config.toml and customize as needed
#
# Configuration loading order (later overrides earlier):
# 1. Default values (built-in)
# 2. This config file
# 3. Environment variables (JOGHD_ prefix)

[app]
# Run mode: "oneshot" (check once and exit) or "continuous" (persistent monitoring)
mode = "continuous"
# Log level: debug, info, warn, error
log_level = "info"
# Maximum concurrent health checks (must be at least 1)
concurrency = 10
# Re-send an alert for a still-unhealthy target every N check intervals.
# Set to 0 to disable reminders.
reminder_multiplier = 6

[http]
# Default request timeout
timeout = "10s"
# User-Agent header for requests
user_agent = "Joghd/1.0"
# Skip TLS certificate verification (for self-signed certs)
skip_tls_verification = false
# Default proxy for every target AND every alerter that does not set its own:
#   ""                         (default) follow HTTP_PROXY/HTTPS_PROXY/NO_PROXY
#   "direct"                   no proxy at all, the environment ignored too
#   "http://host:3128"         an HTTP proxy (also https://)
#   "socks5h://host:1080"      a SOCKS5 proxy; the only kind tcp:// targets can use
# Credentials in the URL (socks5h://user:pass@host:1080) are redacted in logs.
# proxy = "socks5h://127.0.0.1:1080"
# Fail an https check while its certificate expires within this window, e.g.
# "336h" for two weeks. 0 (the default) turns the check off. A target can set
# its own cert_expiry_warning; a negative value there turns it off for that
# target.
cert_expiry_warning = "0s"

[retry]
# Maximum retry attempts before declaring failure
max_attempts = 3
# Initial wait time between retries
initial_wait = "1s"
# Maximum wait time between retries
max_wait = "10s"
# Multiplier for exponential backoff
multiplier = 2.0

[metrics]
# Serve Prometheus metrics at /metrics on this host:port. Empty (the default)
# serves nothing. There is no authentication: bind to localhost or a private
# address.
# listen = "127.0.0.1:9469"

# Alerter instances are declared under [alerters.<name>]. The table key
# becomes the instance name used in logs. You can declare multiple
# instances of the same type (e.g. one Telegram channel per company).
#
# Each instance supports an optional `companies` allow-list. An empty or
# missing list makes the instance a catch-all that receives every alert.
# A non-empty list restricts the instance to targets whose `company`
# matches. Catch-all instances still receive company-matched alerts.

# Enable this once the credentials below are real; the placeholders would
# otherwise send every alert to a bot token that does not exist.
[alerters.rahacloud]
type = "telegram"
enabled = false
# Telegram Bot API token (can be overridden via JOGHD_ALERTERS__RAHACLOUD__BOT_TOKEN)
bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# Telegram Chat ID (can be overridden via JOGHD_ALERTERS__RAHACLOUD__CHAT_ID)
chat_id = "-1001234567890"
# Optional; defaults to 10s. Must be positive: a zero timeout would let a
# hung alert block health checking.
timeout = "10s"
# No `companies` → catch-all, receives every alert.

[alerters.acme_corp]
type = "telegram"
enabled = false
bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
chat_id = "-1009876543210"
timeout = "10s"
# Only receives alerts whose target.company is "Acme Corp".
companies = ["Acme Corp"]

[alerters.team_mattermost]
type = "mattermost"
enabled = false
# Incoming webhook URL from Mattermost (can be overridden via
# JOGHD_ALERTERS__TEAM_MATTERMOST__WEBHOOK_URL)
webhook_url = "https://mattermost.example.com/hooks/xxxxxxxxxxxxxxxxxxxxxxxxxx"
# Optional overrides for the default webhook settings:
# channel = "#alerts"
# username = "Joghd"
# icon_url = "https://example.com/owl.png"
timeout = "10s"
# Optional: this alerter's own proxy (same values as http.proxy). Unset, it
# inherits http.proxy.
# proxy = "direct"

# Define targets to monitor
# Each target is defined as [[targets]]

[[targets]]
name = "Example API Health"
url = "https://httpstat.us/200"
expected_status = 200
method = "GET"
# Check interval (for continuous mode)
interval = "30s"
# Optional: per-target timeout override
# timeout = "5s"
# Optional: company name shown in alert footer
# company = "Acme Corp"
# Optional: contact point shown in alert footer
# contact = "@oncall-team"
# Optional: this target's own proxy (same values as http.proxy). Unset, it
# inherits http.proxy.
# proxy = "direct"
# Optional: this target's own certificate expiry window. Unset or 0 inherits
# http.cert_expiry_warning; a negative value such as "-1s" turns it off.
# cert_expiry_warning = "720h"

[[targets]]
name = "Example API with Headers"
url = "https://httpstat.us/200"
expected_status = 200
method = "GET"
interval = "1m"
company = "Acme Corp"
contact = "@oncall-team"
[targets.headers]
Authorization = "Bearer your-token-here"
X-Custom-Header = "custom-value"

# A TCP connect check: passes when a connection to host:port is established
# within the timeout. expected_status, method and headers do not apply. It goes
# direct, or through a socks5:// / socks5h:// proxy; an HTTP proxy cannot
# carry it and is rejected at startup.
[[targets]]
name = "Example database port"
url = "tcp://db.example.com:5432"
interval = "1m"
# proxy = "socks5h://127.0.0.1:1080"
